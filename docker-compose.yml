# ============================================================
# DBMS_C_plus_plus — Docker Compose deployment
#
# Usage:
#   mkdir -p deploy/tls           # place server.crt and server.key here
#   docker-compose up -d          # start TLS-protected server on port 9999
#   docker-compose logs -f        # follow logs
#   docker-compose down           # stop
#
#   nc localhost 9999             # connect with netcat
# ============================================================

services:
  dbms:
    build:
      context: .
      dockerfile: Dockerfile
    image: dbms-c-plus-plus:latest
    container_name: dbms_server
    # Run in TCP server mode (remove for interactive use)
    # Port configurable via DBMS_PORT env var (default 9999)
    command: ["./dbms_main", "--server", "${DBMS_PORT:-9999}"]
    environment:
      DBMS_TLS_CERT: /etc/dbms/tls/server.crt
      DBMS_TLS_KEY: /etc/dbms/tls/server.key
    ports:
      - "${DBMS_PORT:-9999}:${DBMS_PORT:-9999}"
    volumes:
      # Persist database files outside the container
      - dbms_data:/data
      # Production TLS material; keep the private key readable only by the host operator
      - ./deploy/tls:/etc/dbms/tls:ro
    restart: unless-stopped
    # Resource limits (adjust to taste)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  dbms_data:
    driver: local

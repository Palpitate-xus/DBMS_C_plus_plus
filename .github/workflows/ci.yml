# CI pipeline for DBMS_C_plus_plus.  Runs the same scripts a developer runs
# locally: scripts/ci.sh builds the server, executes the complete C++
# regression suite plus the Python E2E tests, and runs the sanitizer pass.
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  regression:
    name: build + regression + e2e + sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake python3 zlib1g-dev

      - name: Show toolchain
        run: |
          g++ --version
          cmake --version
          python3 --version

      - name: CI (build + regression + sanitizers)
        run: scripts/ci.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: /tmp/ci_*.log
          if-no-files-found: ignore
